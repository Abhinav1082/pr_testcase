name: Auto-Generate Tests & Approve PR

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-test:
    runs-on: ubuntu-latest
    # Skip if the PR was opened by the bot itself (prevents infinite loops)
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.pull_request.title, '[auto-test-skip]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run automated test pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AICORE_AUTH_URL: ${{ secrets.SAP_AI_CORE_AUTH_URL }}
          AICORE_CLIENT_ID: ${{ secrets.SAP_AI_CORE_CLIENT_ID }}
          AICORE_CLIENT_SECRET: ${{ secrets.SAP_AI_CORE_CLIENT_SECRET }}
          AICORE_API_BASE: ${{ secrets.SAP_AI_CORE_API_BASE }}
          AICORE_RESOURCE_GROUP: ${{ secrets.SAP_AI_CORE_RESOURCE_GROUP }}
        run: python scripts/main.py
